# https://www.home-assistant.io/integrations/default_config/
default_config:

# Loading the integration starts its active LAN discovery scan.
miner:

# https://www.home-assistant.io/integrations/logger/
logger:
  default: info
  logs:
    custom_components.miner: debug
debugpy:
  # Start manually with the debugpy.start action after HA finishes startup.
  # Starting early breaks uv subprocesses used to install integration requirements.
  start: false
